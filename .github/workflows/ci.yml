name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.0.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Show tool versions
        run: ./scripts/check-tooling.sh

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build Wasm artifacts
        run: make artifacts

      - name: Record artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version = "/ {print $2; exit}' Cargo.toml)"
          printf 'version=%s\ncommit=%s\nprofile=release\n' "$VERSION" "$GITHUB_SHA" > dist/PROVENANCE.txt
          (
            cd dist
            sha256sum *.wasm > SHA256SUMS
          )

      - name: Upload Wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lily-wasm-${{ github.sha }}
          path: |
            dist/*.wasm
            dist/SHA256SUMS
            dist/PROVENANCE.txt
          if-no-files-found: error
