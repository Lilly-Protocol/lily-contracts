name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.0.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Show tool versions
        run: ./scripts/check-tooling.sh

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build Wasm artifacts
        run: make artifacts

      - name: Record artifact provenance
        run: |
          sha256sum dist/*.wasm > dist/SHA256SUMS
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/BUILD_INFO

      - name: Upload Wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lily-contracts-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
