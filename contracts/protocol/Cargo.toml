[package]
name = "protocol"
description = "Soroban protocol configuration contract for Lily Protocol"
keywords = ["stellar", "soroban", "protocol", "configuration", "blockchain"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
lily-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
lily-test-support = { workspace = true }

[lints]
workspace = true
